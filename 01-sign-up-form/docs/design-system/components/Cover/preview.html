<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fieldnote</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .moss { fill:var(--moss); }
  .ink { fill:var(--ink); }
  .hl { fill:var(--highlighter); }
  .tint { fill:var(--graphite); }
  .blk { rx:var(--radius-lg); }
  .mark { rx:var(--radius-sm); }
  .ruled { stroke:var(--hairline); stroke-width:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:88px; line-height:.92; font-weight:600; letter-spacing:-.015em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 3px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--graphite); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      moss 160×228 slab bled off the top (the action colour, largest) · ink 176×128 · highlighter 48-tall band bled off the right like a marker stroke · graphite 104×64 satellite — about 30% of 960×288
  arrangement one tall moss slab with satellites; moss and highlighter bottoms share one line, ink and graphite tops share another; space-4 gutters
  pattern     editorial serif + "borders, not shadows" + a notebook product → four ruled notebook lines in hairline at a space-8 pitch, crossing the blocks
  scales      sides in space-2 multiples; gutters space-4; pitch space-8; corners radius-lg on blocks, radius-sm on the highlighter band
-->
<rect class="moss blk" x="24" y="-12" width="160" height="228" rx="12"/>
<rect class="ink blk" x="200" y="24" width="176" height="128" rx="12"/>
<rect class="tint blk" x="392" y="88" width="104" height="64" rx="12"/>
<rect class="hl mark" x="200" y="168" width="300" height="48" rx="3"/>
<line class="ruled" x1="0" y1="56.5" x2="480" y2="56.5"/>
<line class="ruled" x1="0" y1="88.5" x2="480" y2="88.5"/>
<line class="ruled" x1="0" y1="120.5" x2="480" y2="120.5"/>
<line class="ruled" x1="0" y1="248.5" x2="480" y2="248.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Fieldnote</h1>
<p class="tag">Your research notes, in one place.</p>
</div>
</div>
</body>
</html>
